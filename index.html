<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#181e1b" />
    <title>JapRead · 在阅读中，与日语相遇</title>
    <script>
      try {
        const theme = localStorage.getItem("japread.theme");
        document.documentElement.dataset.theme = theme === "light" || (theme === "system" && !matchMedia("(prefers-color-scheme: dark)").matches) ? "light" : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
